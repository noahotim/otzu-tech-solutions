<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/logo.png" />
  <title>OTZU Tech Solutions – Guest House Management</title>
  <style>
    :root {
      --navy-950: #071426; --navy-900: #0a1b33; --navy-800: #0e2447;
      --teal-500: #14b8a6; --teal-600: #0d9488; --teal-400: #2dd4bf;
      --line: #e2e8f0; --muted: #64748b; --bg: #f1f5f9; --red: #dc2626;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: #0f172a; line-height: 1.55; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: 0.95rem; }

    /* Login */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(150deg, var(--navy-900), var(--navy-950)); padding: 20px;
    }
    .login-card {
      width: 100%; max-width: 380px; background: #fff; border-radius: 16px; padding: 28px;
      box-shadow: 0 20px 60px rgb(0 0 0 / 0.35); text-align: center;
    }
    .login-card img { width: 64px; height: 64px; object-fit: contain; margin: 0 auto 12px; border-radius: 12px; }
    .login-card h1 { font-size: 1.15rem; color: var(--navy-900); }
    .login-card p { color: var(--muted); font-size: 0.88rem; margin: 8px 0 18px; }
    .login-card input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px;
    }
    .login-card input:focus { outline: none; border-color: var(--teal-500); box-shadow: 0 0 0 3px rgb(20 184 166 / 0.15); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 16px; border: 0; border-radius: 10px; font-weight: 700; font-size: 0.9rem;
      background: var(--teal-500); color: #fff; transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn:hover { background: var(--teal-600); }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.ghost:hover { background: var(--bg); color: var(--navy-900); }
    .btn.small { padding: 6px 10px; font-size: 0.8rem; }
    .btn.warn { background: rgb(220 38 38 / 0.1); color: var(--red); }
    .btn.warn:hover { background: rgb(220 38 38 / 0.18); }
    .btn.block { width: 100%; }
    .error { color: var(--red); font-size: 0.85rem; margin-top: 10px; }

    /* Layout */
    #appScreen { display: none; min-height: 100vh; }
    .layout { display: flex; min-height: 100vh; }
    aside {
      width: 230px; flex-shrink: 0; background: var(--navy-900); color: #fff;
      display: flex; flex-direction: column; padding: 16px 12px; gap: 4px;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; font-weight: 800; font-size: 0.95rem; }
    .brand img { width: 30px; height: 30px; object-fit: contain; border-radius: 7px; }
    .brand span { color: var(--teal-400); font-weight: 600; }
    aside button {
      text-align: left; padding: 10px 12px; border: 0; border-radius: 9px; background: transparent;
      color: rgb(255 255 255 / 0.75); font-size: 0.9rem; font-weight: 600; transition: background 0.15s ease, color 0.15s ease;
    }
    aside button:hover { background: rgb(255 255 255 / 0.08); color: #fff; }
    aside button.active { background: rgb(20 184 166 / 0.16); color: var(--teal-400); }
    aside .spacer { flex: 1; }
    main { flex: 1; min-width: 0; padding: 22px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .topbar h1 { font-size: 1.35rem; color: var(--navy-900); }

    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 14px 16px; }
    .stat .label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
    .stat .value { font-size: 1.35rem; font-weight: 800; color: var(--navy-900); margin-top: 4px; }

    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    .card h2 { font-size: 1rem; color: var(--navy-900); margin-bottom: 12px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 8px 10px; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    .tablewrap { overflow-x: auto; }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
    .b-confirmed { background: rgb(14 165 233 / 0.12); color: #0284c7; }
    .b-pending { background: rgb(245 158 11 / 0.14); color: #b45309; }
    .b-checked_in { background: rgb(16 185 129 / 0.12); color: #059669; }
    .b-checked_out { background: rgb(100 116 139 / 0.14); color: #475569; }
    .b-cancelled { background: rgb(220 38 38 / 0.1); color: var(--red); }
    .b-open { background: rgb(245 158 11 / 0.14); color: #b45309; }
    .b-paid { background: rgb(16 185 129 / 0.12); color: #059669; }
    .b-low { background: rgb(220 38 38 / 0.1); color: var(--red); }
    .b-ok { background: rgb(16 185 129 / 0.12); color: #059669; }
    .b-available { background: rgb(16 185 129 / 0.12); color: #059669; }
    .b-maintenance { background: rgb(245 158 11 / 0.14); color: #b45309; }
    .b-occupied { background: rgb(14 165 233 / 0.12); color: #0284c7; }
    .b-dirty { background: rgb(245 158 11 / 0.14); color: #b45309; }
    .b-cleaning { background: rgb(20 184 166 / 0.12); color: #0d9488; }
    .b-out_of_order { background: rgb(220 38 38 / 0.1); color: var(--red); }
    .b-sent { background: rgb(16 185 129 / 0.12); color: #059669; }
    .b-simulated { background: rgb(14 165 233 / 0.12); color: #0284c7; }
    .b-failed { background: rgb(220 38 38 / 0.1); color: var(--red); }

    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tabs button { padding: 8px 16px; border: 1px solid var(--line); background: #fff; border-radius: 9px; font-weight: 600; color: var(--muted); }
    .tabs button.active { background: var(--navy-900); color: #fff; border-color: var(--navy-900); }

    .bars { display: flex; align-items: flex-end; gap: 10px; height: 160px; margin-top: 14px; }
    .bar { flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--teal-400), var(--teal-600)); min-height: 3px; }
    .bar-label { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.72rem; color: var(--muted); }

    /* Modal */
    #modalBackdrop {
      position: fixed; inset: 0; background: rgb(7 20 38 / 0.55); display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 50;
    }
    #modalBackdrop[hidden] { display: none; }
    .modal {
      background: #fff; border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 22px;
      box-shadow: 0 24px 80px rgb(0 0 0 / 0.35);
    }
    .modal h3 { font-size: 1.05rem; color: var(--navy-900); margin-bottom: 4px; }
    .modal .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
    .modal .field { margin-bottom: 12px; }
    .modal label { display: block; font-size: 0.82rem; font-weight: 700; color: var(--navy-900); margin-bottom: 5px; }
    .modal input, .modal select, .modal textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--teal-500); box-shadow: 0 0 0 3px rgb(20 184 166 / 0.15); }
    .modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy-900); color: #fff;
      padding: 11px 18px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; box-shadow: 0 12px 40px rgb(0 0 0 / 0.3);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 60;
    }
    #toast.show { opacity: 1; }
    #toast.err { background: var(--red); }

    @media (max-width: 900px) {
      .layout { flex-direction: column; }
      aside { width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; }
      aside .brand { width: 100%; }
      aside button { padding: 8px 12px; }
      aside .spacer { display: none; }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <div id="appScreen">
    <div class="layout">
      <aside>
        <div class="brand"><img src="/logo.png" alt="logo" /> OTZU <span>Manage</span></div>
        <div id="who" style="font-size:0.75rem;color:rgb(255 255 255 / 0.55);padding:0 12px 10px;"></div>
        <button data-view="dashboard" data-roles="owner,system_admin,manager,finance,receptionist" class="active">Dashboard</button>
        <button data-view="reservations" data-roles="owner,system_admin,manager,receptionist">Reservations</button>
        <button data-view="rooms" data-roles="owner,system_admin,manager">Rooms</button>
        <button data-view="guests" data-roles="owner,system_admin,manager,receptionist">Guests</button>
        <button data-view="billing" data-roles="owner,system_admin,manager,finance,receptionist">Billing &amp; Payments</button>
        <button data-view="inventory" data-roles="owner,system_admin,manager">Inventory</button>
        <button data-view="staff" data-roles="owner,system_admin,manager,finance">Staff</button>
        <button data-view="attendance" data-roles="owner,system_admin,manager,finance,receptionist,housekeeping,cleaner">Attendance</button>
        <button data-view="attendanceReport" data-roles="owner,system_admin,manager,finance">Attendance Report</button>
        <button data-view="notifications" data-roles="owner,system_admin,manager,receptionist">SMS Notifications</button>
        <button data-view="housekeeping" data-roles="owner,system_admin,manager,housekeeping,cleaner">Housekeeping</button>
        <button data-view="reports" data-roles="owner,system_admin,manager,finance">Reports</button>
        <button data-view="payroll" data-roles="owner,system_admin,manager,finance">Payroll</button>
        <button data-view="repair" data-roles="owner,system_admin,manager">Repair</button>
        <button data-view="users" data-roles="owner,system_admin">Users</button>
        <button data-view="sysadmin" data-roles="owner,system_admin">System Admin</button>
        <div class="spacer"></div>
        <a href="/" style="color:rgb(255 255 255 / 0.55);font-size:0.8rem;padding:6px 12px;">← View website</a>
        <button id="changePwdBtn">Change password</button>
        <button id="logoutBtn">Log out</button>
      </aside>
      <main id="content"></main>
    </div>
  </div>

  <div id="modalBackdrop" hidden>
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <p class="sub" id="modalSub"></p>
      <div id="modalBody"></div>
      <div class="modal-footer">
        <button class="btn ghost" id="modalCancel">Cancel</button>
        <button class="btn" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    (function () {
      "use strict";
      var KEY = "otzuAdminKey";
      var content = document.getElementById("content");
      var currentView = "dashboard";
      var currentUser = null;
      var modalFields = [];
      var modalOnSubmit = null;
      var toastTimer = null;

      function getKey() { try { return sessionStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
      function setKey(k) { try { sessionStorage.setItem(KEY, k); } catch (e) {} }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function money(n) { return "UGX " + Number(n || 0).toLocaleString(); }
      function dstr(v) {
        if (!v) return "—";
        try { return new Date(String(v).length === 10 ? v + "T00:00:00" : v).toLocaleDateString(); } catch (e) { return String(v); }
      }
      function eatTimeStr(v) {
        if (!v) return "—";
        try {
          var d = new Date(v);
          if (isNaN(d)) return String(v);
          return d.toLocaleString("en-GB", { timeZone: "Africa/Kampala", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
        } catch (e) { return String(v); }
      }
      function liveHours(r) {
        if (r.hours != null) return r.hours + "h";
        if (r.clock_in && !r.clock_out) return Math.max(0, Math.round(((Date.now() - new Date(r.clock_in).getTime()) / 3600000) * 100) / 100) + "h";
        return "—";
      }
      function badge(status, label) {
        return '<span class="badge b-' + esc(status) + '">' + esc(label || status.replace(/_/g, " ")) + "</span>";
      }
      function toast(msg, isErr) {
        var el = document.getElementById("toast");
        el.textContent = msg;
        el.className = isErr ? "show err" : "show";
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.className = ""; }, 3200);
      }

      async function api(path, opts) {
        opts = opts || {};
        var headers = { "x-admin-key": getKey() };
        if (opts.body !== undefined) headers["Content-Type"] = "application/json";
        var res = await fetch(path, {
          method: opts.method || "GET",
          headers: headers,
          body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
        });
        var json = {};
        try { json = await res.json(); } catch (e) {}
        if (res.status === 401) { showLogin(); throw new Error("Unauthorized"); }
        if (!res.ok) throw new Error(json.error || "Request failed");
        return json;
      }

      function showLogin() {
        window.location.href = "/manage";
      }
      function showApp() {
        var loginScreen = document.getElementById("loginScreen");
        if (loginScreen) loginScreen.style.display = "none";
        document.getElementById("appScreen").style.display = "block";
      }

      /* ---------- Modal ---------- */
      function openModal(title, sub, fields, onSubmit, saveLabel) {
        modalFields = fields;
        modalOnSubmit = onSubmit;
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalSub").textContent = sub || "";
        document.getElementById("modalBody").innerHTML = fields
          .map(function (f) {
            var control = "";
            if (f.type === "select") {
              control =
                '<select id="f_' + esc(f.name) + '">' +
                (f.options || []).map(function (o) {
                  return '<option value="' + esc(o.value) + '"' + (String(f.value) === String(o.value) ? " selected" : "") + ">" + esc(o.label) + "</option>";
                }).join("") +
                "</select>";
            } else if (f.type === "textarea") {
              control = '<textarea id="f_' + esc(f.name) + '" rows="3">' + esc(f.value || "") + "</textarea>";
            } else if (f.type === "checkbox") {
              control = '<input type="checkbox" id="f_' + esc(f.name) + '"' + (f.value ? " checked" : "") + ">";
            } else {
              control =
                '<input type="' + esc(f.type || "text") + '" id="f_' + esc(f.name) + '" value="' + esc(f.value || "") + '"' +
                (f.required ? " required" : "") + ">";
            }
            return '<div class="field"><label>' + esc(f.label) + "</label>" + control + "</div>";
          })
          .join("");
        document.getElementById("modalSave").textContent = saveLabel || "Save";
        document.getElementById("modalBackdrop").hidden = false;
        var first = document.querySelector("#modalBody input, #modalBody select");
        if (first) first.focus();
      }
      function closeModal() { document.getElementById("modalBackdrop").hidden = true; modalOnSubmit = null; }
      document.getElementById("modalCancel").addEventListener("click", closeModal);
      document.getElementById("modalBackdrop").addEventListener("click", function (e) {
        if (e.target.id === "modalBackdrop") closeModal();
      });
      document.getElementById("modalSave").addEventListener("click", async function () {
        if (!modalOnSubmit) return;
        var values = {};
        for (var i = 0; i < modalFields.length; i++) {
          var f = modalFields[i];
          var el = document.getElementById("f_" + f.name);
          values[f.name] = f.type === "checkbox" ? el.checked : el.value;
        }
        var btn = this;
        btn.disabled = true;
        try {
          await modalOnSubmit(values);
          closeModal();
          go(currentView);
        } catch (e) {
          toast(e.message || "Could not save", true);
        } finally {
          btn.disabled = false;
        }
      });

      /* ---------- Views ---------- */
      function stat(label, value) {
        return '<div class="stat"><div class="label">' + esc(label) + '</div><div class="value">' + value + "</div></div>";
      }

      async function viewDashboard() {
        var data = await api("/api/reports");
        var s = data.stats;
        content.innerHTML =
          '<div class="topbar"><h1>Dashboard</h1></div>' +
          '<div class="stats">' +
          stat("Rooms", s.rooms) + stat("Rooms ready", s.availableRooms) + stat("Occupied today", s.occupiedToday) +
          stat("Upcoming bookings", s.activeReservations) + stat("Guests", s.guests) + stat("Outstanding", money(s.openTotal)) +
          stat("Arrivals today", s.arrivalsToday) + stat("Departures today", s.departuresToday) +
          "</div>" +
          '<p style="font-size:0.8rem;color:var(--muted);margin:-6px 0 12px;">A room can have several bookings on different dates — that is why upcoming bookings can be more than the number of rooms. "Occupied today" shows the rooms actually in use right now.</p>' +
          '<div class="card"><h2>Recent payments</h2><div class="tablewrap"><table>' +
          "<thead><tr><th>Invoice</th><th>Guest</th><th>Method</th><th>Date</th><th>Amount</th></tr></thead><tbody>" +
          (s.recentPayments.length
            ? s.recentPayments.map(function (p) {
                return "<tr><td>" + esc(p.invoice_number || "—") + "</td><td>" + esc(p.guest_name || "—") + "</td><td>" + esc(p.method) + "</td><td>" + dstr(p.received_at) + "</td><td><strong>" + money(p.amount) + "</strong></td></tr>";
              }).join("")
            : '<tr><td colspan="5" class="empty">No payments yet.</td></tr>') +
          "</tbody></table></div></div>";
      }

      async function viewReservations() {
        var data = await api("/api/reservations");
        var rows = data.items || [];
        var PAY_LABEL = { pay_on_arrival: "On arrival", mobile_money: "Mobile Money", card: "Card", bank: "Bank" };
        content.innerHTML =
          '<div class="topbar"><h1>Reservations</h1><button class="btn" id="newRes">+ New reservation</button></div>' +
          '<div class="card"><div class="tablewrap"><table><thead><tr>' +
          "<th>Ref</th><th>Guest</th><th>Room</th><th>Stay</th><th>Nights</th><th>Total</th><th>Payment</th><th>Status</th><th>Actions</th>" +
          "</tr></thead><tbody>" +
          (rows.length
            ? rows.map(function (r) {
                var nights = Math.max(1, Math.round((new Date(r.check_out) - new Date(r.check_in)) / 86400000));
                return (
                  "<tr>" +
                  "<td><small style='color:var(--muted);'>" + esc(r.confirmation_code || "RES-" + String(r.id).padStart(4, "0")) + "</small></td>" +
                  "<td><strong>" + esc(r.guest_name) + "</strong>" + (r.guest_phone ? "<br><small>" + esc(r.guest_phone) + "</small>" : "") + "</td>" +
                  "<td>" + esc(r.room_name) + "</td>" +
                  "<td>" + dstr(r.check_in) + " → " + dstr(r.check_out) + "</td>" +
                  "<td>" + nights + "</td>" +
                  "<td>" + money(nights * r.rate_per_night) + "</td>" +
                  "<td>" + esc(PAY_LABEL[r.payment_method] || r.payment_method || "—") + (r.payment_phone ? "<br><small>" + esc(r.payment_phone) + "</small>" : "") + "</td>" +
                  "<td>" + badge(r.status) +
                    (r.expires_at ? '<br><small style="color:#b45309;font-weight:600;font-size:0.72rem;">Held until ' + esc(dstr(r.expires_at)) + "</small>" : "") +
                  "</td>" +
                  "<td><div class='actions'>" +
                  (r.status === "confirmed" && r.confirmation_code ? '<button class="btn small" data-cashpay="' + esc(r.confirmation_code) + '">Cash</button>' : "") +
                  (r.status === "confirmed" ? '<button class="btn small" data-act="checkin" data-id="' + r.id + '">Check in</button>' : "") +
                  (r.status === "checked_in" ? '<button class="btn small" data-act="checkout" data-id="' + r.id + '">Check out</button>' : "") +
                  (r.status === "confirmed" || r.status === "checked_in" ? '<button class="btn small ghost" data-act="cancel" data-id="' + r.id + '">Cancel</button>' : "") +
                  '<a class="btn small ghost" href="/pay?ref=' + esc(r.confirmation_code || ("RES-" + String(r.id).padStart(4, "0"))) + '" target="_blank" rel="noopener">Pay link</a>' +
                  '<a class="btn small ghost" href="/api/booking?action=receipt-pdf&ref=' + esc(r.confirmation_code || ("RES-" + String(r.id).padStart(4, "0"))) + '" target="_blank" rel="noopener">Receipt PDF</a>' +
                  '<button class="btn small ghost" data-act="edit" data-id="' + r.id + '">Edit</button>' +
                  '<button class="btn small warn" data-act="del" data-id="' + r.id + '">Delete</button>' +
                  "</div></td></tr>"
                );
              }).join("")
            : '<tr><td colspan="9" class="empty">No reservations yet. Click “New reservation” to book a room.</td></tr>') +
          "</tbody></table></div></div>";
        document.getElementById("newRes").onclick = function () {
          openReservationModal(null, rows);
        };
      }

      async function openReservationModal(edit, rows) {
        var guests = (await api("/api/catalog?resource=guests")).items || [];
        var rooms = (await api("/api/catalog?resource=rooms")).items || [];
        var fields = [
          { name: "guestId", label: "Guest", type: "select", options: guests.map(function (g) { return { value: g.id, label: g.name + (g.phone ? " — " + g.phone : "") }; }), value: edit ? edit.guest_id : "" },

      function uploadFile(file) {
        return fetch(
          "/api/upload?name=" + encodeURIComponent(file.name) + "&type=" + encodeURIComponent(file.type),
          { method: "POST", body: file },
        )
          .then(function (res) {
            return res.json().then(function (json) {
              if (!res.ok) throw new Error(json.error || "Upload failed");
              return json.url;
            });
          });
      }

      function addMediaRow(item) {
        var wrap = document.getElementById("roomMedia");
        var placeholder = wrap.querySelector(".empty");
        if (placeholder) placeholder.remove();
        var row = document.createElement("div");
        row.className = "media-row";
        row.style.cssText = "display:flex;gap:8px;align-items:center;margin-bottom:8px;";
        var typeSel = document.createElement("select");
        typeSel.innerHTML = '<option value="image">Image</option><option value="video">Video</option>';
        typeSel.value = item.type === "video" ? "video" : "image";
        var urlInput = document.createElement("input");
        urlInput.value = item.url || "";
        urlInput.placeholder = "Paste image or video URL";
        urlInput.style.flex = "1";
        var preview = document.createElement("span");
        preview.style.cssText = "width:46px;height:38px;overflow:hidden;border-radius:6px;background:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;";
        function updatePreview() {
          var u = urlInput.value.trim();
          if (!u) { preview.innerHTML = ""; return; }
          if (typeSel.value === "video") preview.innerHTML = '<video src="' + esc(u) + '" muted style="width:46px;height:38px;object-fit:cover;"></video>';
          else preview.innerHTML = '<img src="' + esc(u) + '" alt="" style="width:46px;height:38px;object-fit:cover;" />';
        }
        typeSel.onchange = updatePreview;
        urlInput.oninput = updatePreview;
        updatePreview();
        var del = document.createElement("button");
        del.className = "btn small warn";
        del.type = "button";
        del.textContent = "Remove";
        del.onclick = function () {
          row.remove();
          var w = document.getElementById("roomMedia");
          if (!w.querySelector(".media-row")) w.innerHTML = '<p class="empty" style="text-align:left;padding:8px 0;">No media yet — upload or paste a URL.</p>';
        };
        row.appendChild(typeSel);
        row.appendChild(urlInput);
        row.appendChild(preview);
        row.appendChild(del);
        wrap.appendChild(row);
      }

      function renderMedia(list) {
        var wrap = document.getElementById("roomMedia");
        wrap.innerHTML = "";
        if (!list.length) {
          wrap.innerHTML = '<p class="empty" style="text-align:left;padding:8px 0;">No media yet — upload or paste a URL.</p>';
          return;
        }
        list.forEach(function (item) { addMediaRow(item); });
      }

      function collectMedia() {
        var out = [];
        document.querySelectorAll("#roomMedia .media-row").forEach(function (row) {
          var sel = row.querySelector("select");
          var inp = row.querySelector("input");
          var url = (inp.value || "").trim();
          if (url) out.push({ type: sel.value, url: url });
        });
        return out;
      }

      content.addEventListener("click", function (e) {
        var t = e.target.closest("button");
        if (!t) return;
        var id = t.getAttribute("data-id");
        var act = t.getAttribute("data-act");
        var pay = t.getAttribute("data-pay");
        var cashPay = t.getAttribute("data-cashpay");
        var resetPwd = t.getAttribute("data-resetpwd");
        var impersonate = t.getAttribute("data-impersonate");
        var adj = t.getAttribute("data-adj");
        var done = t.getAttribute("data-done");
        var photo = t.getAttribute("data-photo");

        if (resetPwd) {
          openModal("Reset password — " + (t.getAttribute("data-name") || ""), "Set a new password for this user.", [
            { name: "password", label: "New password", type: "password", value: "", required: true },
            { name: "forceChange", label: "Require change at next login", type: "checkbox", value: true },
          ], async function (v) {
            await api("/api/auth?action=reset-password", { method: "POST", body: { id: Number(resetPwd), password: v.password, forceChange: !!v.forceChange } });
            toast("Password reset.");
          }, "Reset password");
          return;
        }
        if (impersonate) {
          openModal("Sign in as " + (t.getAttribute("data-name") || "user"), "Opens the console as this user so you can recover their account. The action is recorded in notifications.", [
            { name: "note", label: "Reason", type: "textarea", value: "Forgot login", required: true },
          ], async function () {
            await api("/api/auth?action=impersonate", { method: "POST", body: { id: Number(impersonate) } });
            window.location.href = "/console";
          }, "Sign in as");
          return;
        }

        if (done) {
          api("/api/housekeeping?action=complete", { method: "POST", body: { id: Number(done) } })
            .then(function () { toast("Task completed."); go("housekeeping"); })
            .catch(function (err) { toast(err.message, true); });
          return;
        }
        if (photo) {
          var photoInput = content.querySelector('[data-photo-input="' + photo + '"]');
          if (photoInput) photoInput.click();
          return;
        }

        if (adj) {
          api("/api/catalog?resource=inventory&action=adjust", { method: "POST", body: { id: Number(adj), delta: Number(t.getAttribute("data-d")) } })
            .then(function () { toast("Stock adjusted."); go("inventory"); })
            .catch(function (err) { toast(err.message, true); });
          return;
        }
        if (pay || cashPay) {
          api("/api/billing").then(function (data) {
            var inv = pay
              ? (data.invoices || []).filter(function (i) { return i.id === Number(pay); })[0]
              : (data.invoices || []).filter(function (i) { return i.confirmation_code === cashPay; })[0];
            if (!inv) return;
            openPaymentModal(inv, "cash");
          }).catch(function (err) { toast(err.message, true); });
          return;
        }
        if (act === "edit") {
          if (currentView === "reservations") {
            api("/api/reservations").then(function (data) {
              var r = (data.items || []).filter(function (x) { return x.id === Number(id); })[0];
              if (r) openReservationModal(r);
            });
          } else if (currentView === "rooms") {
            api("/api/catalog?resource=rooms").then(function (data) {
              var r = (data.items || []).filter(function (x) { return x.id === Number(id); })[0];
              if (r) openRoomModal(r);
            });
          } else if (currentView === "guests") {
            api("/api/catalog?resource=guests").then(function (data) {
              var r = (data.items || []).filter(function (x) { return x.id === Number(id); })[0];
              if (r) openGuestModal(r);
            });
          } else if (currentView === "inventory") {
            api("/api/catalog?resource=inventory").then(function (data) {
              var r = (data.items || []).filter(function (x) { return x.id === Number(id); })[0];
              if (r) openItemModal(r);
            });
          } else if (currentView === "staff") {
            api("/api/catalog?resource=staff").then(function (data) {
              var r = (data.items || []).filter(function (x) { return x.id === Number(id); })[0];
              if (r) openStaffModal(r);
            });
          } else if (currentView === "users") {
            api("/api/auth?action=users").then(function (data) {
              var r = (data.users || []).filter(function (x) { return x.id === Number(id); })[0];
              if (r) openUserModal(r);
            });
          }
          return;
        }
        if (act === "del") {
          if (currentView === "users") {
            if (!confirm("Delete this user?")) return;
            api("/api/auth?action=user-delete", { method: "POST", body: { id: Number(id) } })
              .then(function () { toast("User deleted."); go("users"); })
              .catch(function (err) { toast(err.message, true); });
            return;
          }
          if (!confirm("Delete this item?")) return;
          var endpoint =
            currentView === "reservations"
              ? "/api/reservations?id=" + id
              : "/api/catalog?resource=" + currentView + "&id=" + id;
          api(endpoint, { method: "DELETE" }).then(function () { toast("Deleted."); go(currentView); }).catch(function (err) { toast(err.message, true); });
          return;
        }
        if (act === "checkin" || act === "checkout" || act === "cancel") reservationAction(id, act);
      });

      async function viewAttendance() {
        var data = await api("/api/catalog?resource=attendance");
        var self = data.self || {};
        var today = data.today || null;
        var records = data.records || [];
        var sum = data.summary || {};
        var fullView = data.fullView;
        var canAdjust = data.canAdjust;
        var todayText = today
          ? "Today: in " + eatTimeStr(today.clock_in) + (today.clock_out ? " · out " + eatTimeStr(today.clock_out) + " · " + liveHours(today) : " · on duty " + liveHours(today) + " so far")

        if (today && today.note) todayText += " · " + esc(today.note);
        content.innerHTML =
          '<div class="topbar"><h1>Staff Attendance</h1></div>' +
          '<div class="card" style="margin-bottom:14px;"><h2>My attendance — ' + esc(self.staffName || "") + "</h2>" +
          '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;">' +
          '<button class="btn" id="clockIn" ' + (today ? "disabled" : "") + '>Clock in</button>' +
          '<button class="btn" id="clockOut" ' + (today && !today.clock_out ? "" : "disabled") + '>Clock out</button>' +
          "</div>" +
          '<p style="font-size:0.85rem;color:var(--muted);margin-top:10px;" id="attMsg">' + todayText + "</p>" +
          '<p style="font-size:0.78rem;color:var(--muted);margin-top:6px;" id="locStatus">Capturing your location automatically…</p>' +
          '<p style="font-size:0.78rem;color:var(--muted);margin-top:6px;">Location is captured automatically for clock-in/out — attempts far from the guest house are flagged for review. Sign-out is only allowed from 5:00 PM (or by management adjustment).</p>' +
          "</div>" +
          (fullView
            ? '<div class="stats" style="margin-bottom:14px;">' +
              '<div class="stat"><div class="label">On duty now</div><div class="value">' + (sum.present_now || 0) + "</div></div>" +
              '<div class="stat"><div class="label">Today total</div><div class="value">' + (sum.today_total || 0) + "</div></div>" +
              '<div class="stat"><div class="label">Hours (7 days)</div><div class="value">' + (sum.week_hours || 0) + "</div></div>" +
              '<div class="stat"><div class="label">Unverified today</div><div class="value" style="' + (Number(sum.today_unverified) > 0 ? "color:var(--red);" : "") + '">' + (sum.today_unverified || 0) + "</div></div>" +
              "</div>"
            : "") +
          '<div class="card"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Staff</th><th>Clock in</th><th>Clock out</th><th>Hours</th><th>Location</th><th>Status</th>' + (canAdjust ? "<th>Actions</th>" : "") + "</tr></thead><tbody>" +
          (records.length
            ? records.map(function (r) {
                var loc = r.location_verified
                  ? '<span style="color:var(--green);font-weight:700;">Verified</span>'
                  : '<span style="color:var(--red);font-weight:700;">Flagged' + (r.distance_km ? " (" + r.distance_km + "km)" : "") + "</span>";
                return "<tr><td>" + esc(r.date) + "</td><td><strong>" + esc(r.staff_name) + "</strong>" + (r.adjusted_by ? "<br><small style='color:var(--muted);'>adjusted by " + esc(r.adjusted_by) + "</small>" : "") + "</td><td>" + eatTimeStr(r.clock_in) + "</td><td>" + eatTimeStr(r.clock_out) + "</td><td>" + liveHours(r) + "</td><td>" + loc + "</td><td>" + badge(r.status) + "</td>" + (canAdjust ? '<td><button class="btn small ghost" data-att-adjust="1" data-sid="' + r.staff_id + '" data-name="' + esc(r.staff_name) + '" data-date="' + esc(r.date) + '">Adjust</button></td>' : "") + "</tr>";
              }).join("")
            : '<tr><td colspan="8" class="empty">No attendance records yet.</td></tr>') +
          "</tbody></table></div></div>";
        var msg = document.getElementById("attMsg");
        var lastPos = null;
        function withLocation(cb) {
          if (lastPos) { cb(lastPos); return; }
          if (!navigator.geolocation) { cb(null); return; }
          navigator.geolocation.getCurrentPosition(
            function (pos) { lastPos = { lat: pos.coords.latitude, lng: pos.coords.longitude }; cb(lastPos); },
            function () { cb(null); },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 },
          );
        }
        var locStatus = document.getElementById("locStatus");
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              lastPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
              if (locStatus) locStatus.textContent = "Location captured automatically ✓ — clock-in/out will be verified.";
            },
            function () {
              if (locStatus) locStatus.textContent = "Location could not be captured — enable location on this device for verified clock-in/out.";
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 },
          );
        } else if (locStatus) {
          locStatus.textContent = "This device does not support location — clock-ins will be flagged for review.";
        }
        function doClock(action) {
          withLocation(function (loc) {
            var body = {};
            if (loc) { body.lat = loc.lat; body.lng = loc.lng; }
            api("/api/catalog?resource=attendance&action=" + action, { method: "POST", body: body })
              .then(function (r) {
                msg.textContent = (action === "clock-in" ? "Clocked in ✓" : "Clocked out ✓") + (r.warning ? " — " + r.warning : "");
                viewAttendance();
              })
              .catch(function (e) { msg.textContent = e.message; });
          });
        }
        document.getElementById("clockIn").onclick = function () { doClock("clock-in"); };
        document.getElementById("clockOut").onclick = function () { doClock("clock-out"); };
        var adjBtns = content.querySelectorAll("[data-att-adjust]");
        for (var i = 0; i < adjBtns.length; i++) {
          adjBtns[i].addEventListener("click", function () {
            openModal("Adjust attendance — " + this.getAttribute("data-name"), "Correct a missed or wrong clock-in/out. The change is recorded with your name.", [
              { name: "staffId", label: "Staff", type: "hidden", value: this.getAttribute("data-sid") },
              { name: "date", label: "Date", type: "date", value: this.getAttribute("data-date"), required: true },
              { name: "clockIn", label: "Clock in (YYYY-MM-DDTHH:MM)", value: "", required: true },
              { name: "clockOut", label: "Clock out (YYYY-MM-DDTHH:MM)", value: "" },
              { name: "note", label: "Reason", type: "textarea", value: "" },
            ], async function (v) {
              await api("/api/catalog?resource=attendance&action=adjust", { method: "POST", body: v });
              toast("Attendance adjusted.");
            }, "Save adjustment");
          });
        }
      }

              "</div>" +
              '<div class="card"><h2>Summary by staff</h2><div class="tablewrap"><table><thead><tr><th>Staff</th><th>Days</th><th>Hours</th><th>Early sign-outs</th><th>Flagged</th></tr></thead><tbody>' + (staffHtml || '<tr><td colspan="5" class="empty">No records.</td></tr>') + "</tbody></table></div></div>" +
              '<div class="card"><h2>All times in and out</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Staff</th><th>Clock in</th><th>Clock out</th><th>Hours</th><th>Method</th><th>Location</th><th>Reason / Notes</th></tr></thead><tbody>' + rowHtml + "</tbody></table></div></div>";
          } catch (e) {
            body.innerHTML = '<p class="empty">Error: ' + esc(e.message) + "</p>";
          }
        }
        document.getElementById("repLoad").addEventListener("click", load);
        load();
      }

      /* ---------- Navigation ---------- */
      var views = {
        dashboard: viewDashboard,
        reservations: viewReservations,
        rooms: viewRooms,
        guests: viewGuests,
        billing: viewBilling,
        inventory: viewInventory,
        staff: viewStaff,
        attendance: viewAttendance,
        attendanceReport: viewAttendanceReport,
        notifications: viewNotifications,
        housekeeping: viewHousekeeping,
        reports: viewReports,
        payroll: viewPayroll,
        repair: viewRepair,
        users: viewUsers,
        sysadmin: viewSysadmin,
      };

      var ROLE_ALLOW = {
        dashboard: ["owner", "system_admin", "manager", "finance", "receptionist"],
        housekeeping: ["owner", "system_admin", "manager", "housekeeping", "cleaner"],
        reservations: ["owner", "system_admin", "manager", "receptionist"],
        rooms: ["owner", "system_admin", "manager"],
        guests: ["owner", "system_admin", "manager", "receptionist"],
        billing: ["owner", "system_admin", "manager", "finance", "receptionist"],
        inventory: ["owner", "system_admin", "manager"],
        staff: ["owner", "system_admin", "manager", "finance"],
        attendance: ["owner", "system_admin", "manager", "finance", "receptionist", "housekeeping", "cleaner"],
        attendanceReport: ["owner", "system_admin", "manager", "finance"],
        notifications: ["owner", "system_admin", "manager", "receptionist"],
        reports: ["owner", "system_admin", "manager", "finance"],
        payroll: ["owner", "system_admin", "manager", "finance"],
        repair: ["owner", "system_admin", "manager"],
        users: ["owner", "system_admin"],
        sysadmin: ["owner", "system_admin"],
      };

      function can(view) {
        var roles = ROLE_ALLOW[view];
        return !!(currentUser && roles && roles.indexOf(currentUser.role) !== -1);
      }

      function firstView() {
        var order = ["dashboard", "reservations", "rooms", "guests", "billing", "inventory", "staff", "attendance", "attendanceReport", "notifications", "housekeeping", "reports", "payroll", "repair", "users", "sysadmin"];
        for (var i = 0; i < order.length; i++) {
          if (can(order[i])) return order[i];
        }
        return "dashboard";
      }

      function renderNav() {
        var role = currentUser ? currentUser.role : "";
        document.querySelectorAll("aside button[data-view]").forEach(function (b) {
          var roles = (b.getAttribute("data-roles") || "").split(",");
          b.style.display = role && roles.indexOf(role) !== -1 ? "" : "none";
        });
        var who = document.getElementById("who");
        if (who && currentUser) who.textContent = currentUser.name + " · " + currentUser.role;
      }

      function go(view) {
        if (!can(view)) view = "dashboard";
        currentView = view;
        document.querySelectorAll("aside button[data-view]").forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-view") === view);
        });
        content.innerHTML = '<p class="empty">Loading…</p>';
        (views[view] || views.dashboard)().catch(function (e) {
          content.innerHTML = '<p class="empty">Error: ' + esc(e.message) + "</p>";
        });
      }
      document.querySelectorAll("aside button[data-view]").forEach(function (b) {
        b.addEventListener("click", function () { go(b.getAttribute("data-view")); });
      });

      document.getElementById("logoutBtn").addEventListener("click", function () {
        fetch("/api/auth?action=logout", { method: "POST" }).finally(function () {
          window.location.href = "/manage";
        });
      });
      document.getElementById("changePwdBtn").addEventListener("click", function () { changePassword(false); });

      /* ---------- Session check ---------- */
      function checkSession() {
        fetch("/api/auth?action=status")
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.ok && d.user) {
              currentUser = d.user; renderNav(); showApp();
              if (d.user.must_change_password) { changePassword(true); return; }
              go(firstView());
            }
            else { window.location.href = "/manage"; }
          })
          .catch(function () { window.location.href = "/manage"; });
      }
      checkSession();
    })();
  </script>
</body>
</html>
